<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#352651">
<title>Amy's Haven Care Home</title>
<link rel="stylesheet" href="./styles.css?v=9">
<style>#boot-status{max-width:430px;min-height:100vh;margin:0 auto;background:#faf7fc;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#352651;text-align:center}</style>
</head>
<body>
<div id="app"><div id="boot-status"><div><strong style="font-size:22px">Amy's Haven Care Home</strong><br><span style="font-size:14px">Loading game…</span></div></div></div>
<script>
(function(){
 var app=document.getElementById('app');
 function fail(message){if(app)app.innerHTML='<div id="boot-status"><div><strong style="font-size:22px">Amy\'s Haven Care Home</strong><br><span style="font-size:14px">The game could not start.</span><br><small style="display:block;margin-top:10px">'+String(message||'Unknown loading error')+'</small></div></div>'}
 fetch('./game.js?v=9',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load game.js ('+r.status+')');return r.text()}).then(function(code){var names=[],re=/function\s+([A-Za-z_$][\w$]*)\s*\(/g,m;while((m=re.exec(code))!==null){if(names.indexOf(m[1])===-1)names.push(m[1])}code+='\nObject.assign(window,{'+names.join(',')+'});';new Function(code)()}).catch(function(e){fail(e&&e.message?e.message:e)})
})();
</script>
</body>
</html>
