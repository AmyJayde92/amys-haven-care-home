name: Check JavaScript
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check game.js
      - run: node -e "global.document={getElementById:()=>({innerHTML:''})}; global.window={scrollTo:()=>{}}; require('./game.js'); console.log('runtime ok')"
